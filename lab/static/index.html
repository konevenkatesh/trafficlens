<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TrafficLens Lab</title>
<link rel="stylesheet" href="/shared/ui.css" />
</head>
<body>
<div class="app" id="app" data-rail="0">

  <nav class="side" aria-label="Main">
    <div class="side-top">
      <div class="wordmark"><i>◈</i> <span>lab</span></div>
      <button class="icon-btn" id="rail" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar">
        <svg class="ico-close" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m16 9-3 3 3 3"/></svg>
        <svg class="ico-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m13 9 3 3-3 3"/></svg>
      </button>
    </div>
    <div class="side-scroll">
      <div class="grp"><span>Work</span></div>
      <div class="nav" id="nav1"></div>
      <div class="grp"><span>Library</span></div>
      <div class="nav" id="nav2"></div>
      <div class="grp"><span>Setup</span></div>
      <div class="nav" id="nav3"></div>
    </div>
  </nav>

  <div class="main">
    <header class="top">
      <div class="crumb" id="crumb">Overview</div>
      <span class="pill" id="orpill" title="OpenRouter credit"><span class="dot"></span>
        <span class="mono num" id="orbal">—</span></span>
      <span class="pill" id="rppill" title="RunPod balance"><span class="dot"></span>
        <span class="mono num" id="rpbal">—</span></span>
      <button class="icon-btn" id="theme" aria-label="Toggle theme" title="Toggle theme">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.4-6.4-.7.7M6.3 17.7l-.7.7m12.8 0-.7-.7M6.3 6.3l-.7-.7"/><circle cx="12" cy="12" r="4"/></svg>
      </button>
    </header>
    <main id="main"></main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
