# Builds the surveyor's Windows executable.
#
# It runs here rather than on a developer machine because PyInstaller cannot
# cross-compile: it freezes the interpreter and native libraries of the host, so a build
# on macOS produces a macOS app whatever the spec says. A windows-latest runner is the
# cheapest Windows machine available.
#
# torch is installed CPU-only on purpose. The CUDA wheel is ~2.5GB on its own and would
# put the artifact past the 2GB upload limit, and it is useless on a laptop without an
# NVIDIA card -- which is most of them. The app detects CUDA at runtime, so a machine
# that has it can be served by a separate CUDA build when one is asked for.
name: Build survey .exe

on:
  push:
    branches: [main]
    paths: ["survey/**", "app/**", "lab/**", "shared/**", "requirements.txt",
            ".github/workflows/build-survey-exe.yml"]
  workflow_dispatch:

permissions:
  contents: write        # the build publishes itself to a release

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU torch first, from PyTorch's own index. Installing requirements.txt alone
          # would pull the default wheel, which on Windows means a ~2.5GB CUDA build that
          # pushes the artifact past the upload limit and is useless without an NVIDIA
          # card. Same pinned version either way, so the later install is satisfied.
          pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fetch ffprobe
        # Windows ships no ffprobe, and the app cannot read a recording's duration or
        # frame rate without one — every file would look unreadable. A static build is
        # vendored into the bundle rather than asking the surveyor to install anything.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -UseBasicParsing $url -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath fftmp
          $probe = Get-ChildItem fftmp -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $probe) { throw "ffprobe.exe not found in the archive" }
          Copy-Item $probe.FullName vendor/ffprobe.exe
          Write-Host "vendored $($probe.FullName)"

      - name: Check the app imports before freezing it
        # A missing import found here costs 30 seconds; found after a 20-minute freeze it
        # costs the whole build.
        run: |
          python -c "import sys; sys.path[:0]=['survey','app']; sys.path.append('lab'); import api, work, seed; print('imports OK')"

      - name: Build
        run: pyinstaller --noconfirm --clean survey/TrafficLens.spec

      - name: Smoke-test the binary
        # A build that produces an .exe which dies on launch is worse than a failed
        # build, because it ships. The first attempt at this test told me only that the
        # app "did not answer" — it discarded the app's own output, so there was nothing
        # to diagnose. Everything the app prints is captured and dumped on failure.
        shell: pwsh
        env:
          TRAFFICLENS_PORT: "8801"        # an explicit address to poll
          TRAFFICLENS_NO_BROWSER: "1"     # no browser to open on a build agent
        run: |
          $p = Start-Process -PassThru -RedirectStandardOutput app.out `
                 -RedirectStandardError app.err dist/TrafficLens/TrafficLens.exe
          $ok = $false
          # 4 minutes: importing torch and loading the axle checkpoint is slow on a cold
          # runner, and a timeout that is merely tight looks identical to a crash.
          foreach ($i in 1..120) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { Write-Host "the app exited early (code $($p.ExitCode))"; break }
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8801/api/health -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) {
            Write-Host "----- stdout -----"; Get-Content app.out -ErrorAction SilentlyContinue
            Write-Host "----- stderr -----"; Get-Content app.err -ErrorAction SilentlyContinue
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "the built app did not answer /api/health"
          }
          Write-Host "binary answered /api/health"
          # Answering is not enough: with no registered detector it cannot count anything,
          # and that failure would only surface on a surveyor's laptop.
          $m = Invoke-RestMethod http://127.0.0.1:8801/api/models
          if (-not $m.default) { throw "no default detector registered in the built app" }
          Write-Host "default detector: $($m.default)"
          Write-Host "----- app log -----"; Get-Content app.out -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Build the installer
        # Inno Setup, not MSI: no admin rights needed, and a per-user install into
        # LOCALAPPDATA works on the managed laptops these surveyors actually have.
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
              /DAppVersion=1.0.$env:GITHUB_RUN_NUMBER `
              /O"$PWD" survey/installer.iss
          if (-not (Test-Path TrafficLens-Setup.exe)) { throw "installer was not produced" }
          $mb = (Get-Item TrafficLens-Setup.exe).Length / 1MB
          Write-Host ("installer: {0:N0} MB" -f $mb)

      - name: Zip the portable build
        # Shipped alongside the installer: unzip and run, no install, works from a USB
        # stick — which is how footage reaches some of these offices in the first place.
        run: Compress-Archive -Path dist/TrafficLens/* -DestinationPath TrafficLens-portable.zip

      # Published to a ROLLING RELEASE, not as an artifact.
      #
      # Two builds in a row froze cleanly, produced a working installer, and then died on
      # "Artifact storage quota has been hit". Deleting 7.36GB of old artifacts did not
      # help immediately -- GitHub recalculates that usage every 6-12 hours, so every
      # build in that window fails at the last step having done all the work.
      #
      # Releases draw on repository storage instead, which is far larger, and one tag is
      # overwritten each time rather than accumulating. It is also simply a better place
      # for a build: a stable URL somebody can be sent, instead of a login-gated artifact
      # that expires.
      - name: Publish the build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --title "Latest build" --notes "Build ${{ github.run_number }} from ${{ github.sha }}" \
            --target "${{ github.sha }}" \
            TrafficLens-Setup.exe TrafficLens-portable.zip



  # ── the test that matters: install the thing and use it ──
  # The build job only proves the process starts and knows what a detector is. Everything
  # a surveyor actually does — read a folder, place it on a timeline, run the detector,
  # count, produce a workbook — was until now only ever verified on a Mac.
  end-to-end:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch the installer that was just published
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release download latest --pattern "TrafficLens-Setup.exe" --clobber

      - name: Install it the way a surveyor would
        shell: pwsh
        run: |
          # The same silent switches an IT department would use to push it out. /DIR is
          # set explicitly only so the test knows where to find the exe afterwards.
          $dir = "$env:LOCALAPPDATA\TrafficLens"
          Start-Process -Wait -FilePath .\TrafficLens-Setup.exe `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir"
          if (-not (Test-Path "$dir\TrafficLens.exe")) { throw "installer produced no exe at $dir" }
          Write-Host "installed to $dir"
          Get-ChildItem $dir | Select-Object -First 5 Name, Length | Format-Table

      - name: Make a test recording
        # A generated clip, not real footage: client recordings do not belong in CI, and
        # this test is about the machinery rather than detection quality. The filename
        # carries a clock because that is how recordings get placed on the timeline.
        shell: pwsh
        run: |
          $ff = Get-ChildItem "$env:LOCALAPPDATA\TrafficLens" -Recurse -Filter ffprobe.exe |
                Select-Object -First 1
          Write-Host "bundled ffprobe: $($ff.FullName)"
          choco install ffmpeg --no-progress -y | Out-Null
          New-Item -ItemType Directory -Force testfootage | Out-Null
          ffmpeg -y -v error -f lavfi -i testsrc=size=1920x1080:rate=12:duration=20 `
                 -c:v libx264 -pix_fmt yuv420p testfootage/ch01_20260101120000.mp4
          Get-Item testfootage/*.mp4 | ForEach-Object {
            Write-Host ("  {0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB)) }

      - name: Run a whole survey against it
        shell: pwsh
        env:
          TRAFFICLENS_PORT: "8801"
          TRAFFICLENS_NO_BROWSER: "1"
        run: |
          $exe = "$env:LOCALAPPDATA\TrafficLens\TrafficLens.exe"
          $p = Start-Process -PassThru -RedirectStandardOutput e2e.out `
                 -RedirectStandardError e2e.err $exe
          foreach ($i in 1..120) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { break }
            try {
              if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8801/api/health `
                    -TimeoutSec 3).StatusCode -eq 200) { break }
            } catch { }
          }
          python survey/e2e_check.py http://127.0.0.1:8801 testfootage
          $code = $LASTEXITCODE
          Write-Host "----- app stdout -----"; Get-Content e2e.out -ErrorAction SilentlyContinue
          Write-Host "----- app stderr -----"; Get-Content e2e.err -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "the installed app failed the end-to-end run" }
