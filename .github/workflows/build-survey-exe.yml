# Builds the surveyor's Windows executable.
#
# It runs here rather than on a developer machine because PyInstaller cannot
# cross-compile: it freezes the interpreter and native libraries of the host, so a build
# on macOS produces a macOS app whatever the spec says. A windows-latest runner is the
# cheapest Windows machine available.
#
# torch is installed CPU-only on purpose. The CUDA wheel is ~2.5GB on its own and would
# put the artifact past the 2GB upload limit, and it is useless on a laptop without an
# NVIDIA card -- which is most of them. The app detects CUDA at runtime, so a machine
# that has it can be served by a separate CUDA build when one is asked for.
name: Build survey .exe

on:
  push:
    branches: [main]
    paths: ["survey/**", "app/**", "lab/**", "shared/**", "requirements.txt",
            ".github/workflows/build-survey-exe.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU torch first, from PyTorch's own index. Installing requirements.txt alone
          # would pull the default wheel, which on Windows means a ~2.5GB CUDA build that
          # pushes the artifact past the upload limit and is useless without an NVIDIA
          # card. Same pinned version either way, so the later install is satisfied.
          pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fetch model weights
        # The repo is source only. Weights live as assets on the `weights` release, so a
        # clone stays 1.4MB and a retrain does not add another 20MB to history forever.
        # They are pulled in HERE, before freezing, so the .exe the surveyor receives
        # still carries everything inside it and never downloads anything at run time.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force models/attrs | Out-Null
          gh release download weights --dir models --pattern "*.pt" --clobber
          # The axle head belongs in models/attrs, not models/ — seed.py and the spec
          # both look for it there.
          Get-ChildItem models -Filter "axles_*.pt" | ForEach-Object {
            Move-Item $_.FullName models/attrs/ -Force
          }
          $n = (Get-ChildItem models -Recurse -Filter *.pt).Count
          if ($n -lt 2) { throw "expected detector + axle head, found $n weight files" }
          Get-ChildItem models -Recurse -Filter *.pt |
            ForEach-Object { Write-Host ("  {0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB)) }

      - name: Fetch ffprobe
        # Windows ships no ffprobe, and the app cannot read a recording's duration or
        # frame rate without one — every file would look unreadable. A static build is
        # vendored into the bundle rather than asking the surveyor to install anything.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -UseBasicParsing $url -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath fftmp
          $probe = Get-ChildItem fftmp -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $probe) { throw "ffprobe.exe not found in the archive" }
          Copy-Item $probe.FullName vendor/ffprobe.exe
          Write-Host "vendored $($probe.FullName)"

      - name: Check the app imports before freezing it
        # A missing import found here costs 30 seconds; found after a 20-minute freeze it
        # costs the whole build.
        run: |
          python -c "import sys; sys.path[:0]=['survey','app']; sys.path.append('lab'); import api, work, seed; print('imports OK')"

      - name: Build
        run: pyinstaller --noconfirm --clean survey/TrafficLens.spec

      - name: Smoke-test the binary
        # Start it, wait for the port, fetch /api/health. A build that produces an .exe
        # which dies on launch is worse than a failed build, because it ships.
        shell: pwsh
        run: |
          $p = Start-Process -PassThru dist/TrafficLens/TrafficLens.exe
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8801/api/health -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "the built app did not answer /api/health" }
          Write-Host "binary answered /api/health"
          # A build that answers /api/health but has no registered detector cannot count
          # anything, and that failure would only surface on a surveyor's laptop.
          $m = Invoke-RestMethod http://127.0.0.1:8801/api/models
          if (-not $m.default) { throw "no default detector registered in the built app" }
          Write-Host "default detector: $($m.default)"

      - name: Zip
        run: Compress-Archive -Path dist/TrafficLens/* -DestinationPath TrafficLens-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TrafficLens-windows
          path: TrafficLens-windows.zip
          retention-days: 30
