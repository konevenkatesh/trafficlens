<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrafficLens — Annotated Video</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#0b0d10; color:#e8e8e8; font-family:-apple-system,system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  #hdr { padding:10px 16px; background:#1c1f24; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  a { color:#6ab0f3; text-decoration:none; font-size:13px; }
  #wrap { flex:1; display:flex; align-items:center; justify-content:center; background:#000; }
  video { max-width:100%; max-height:92vh; }
  .tip { font-size:12px; color:#8a94a0; }
  select { background:#262a31; color:#e8e8e8; border:1px solid #3a3f47; border-radius:6px; padding:4px 8px; }
</style>
</head>
<body>
<div id="hdr">
  <a href="/">← back</a><b id="title">Annotated video</b>
  <span class="tip">Cross-check boxes, classes and the running in/out counter against what you see. Speed:</span>
  <select id="spd"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
  <span class="tip" id="msg"></span>
</div>
<div id="wrap"><video id="vid" controls playsinline></video></div>
<script>
const vidId = new URLSearchParams(location.search).get("video");
const vid = document.getElementById("vid");
fetch("/api/videos").then(r=>r.json()).then(vs => {
  const v = vs.find(x=>x.id==vidId);
  if (!v) return;
  document.getElementById("title").textContent = "Annotated — " + v.name;
  // Through the API, not the static folder: renders live under the station's directory
  // now, and the static mount only ever saw the old flat one.
  vid.src = "/api/annotated/" + v.id + "?t=" + Date.now();
  vid.onerror = () => document.getElementById("msg").textContent = "⚠ not rendered yet — use 🎬 Render on the home page first";
});
document.getElementById("spd").onchange = e => vid.playbackRate = +e.target.value;
</script>
</body>
</html>
