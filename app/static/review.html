<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrafficLens — Verify Sample</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#101216; color:#e8e8e8; font-family:-apple-system,system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  #hdr { padding:10px 16px; background:#1c1f24; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  a { color:#6ab0f3; text-decoration:none; font-size:13px; }
  #prog { font-size:13px; color:#9aa3ad; }
  #main { display:flex; flex:1; min-height:0; }
  #croppane { width:36%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0d0f12; padding:12px; }
  #cropcv { max-width:100%; border-radius:10px; }
  #claim { margin-top:12px; font-size:19px; font-weight:800; padding:6px 18px; border-radius:10px; background:#262a31; }
  #ctx { flex:1; display:flex; align-items:center; justify-content:center; background:#000; min-width:0; position:relative; }
  #ctxcv { max-width:100%; max-height:100%; }
  #controls { background:#1c1f24; padding:12px 16px 22px; }
  #vrow { display:flex; gap:8px; margin-bottom:10px; }
  #vrow button { flex:1; padding:15px 6px; font-size:15px; font-weight:700; border:none; border-radius:10px; cursor:pointer; color:#fff; }
  #ok { background:#0a7d33; } #nv { background:#b03030; } #skipb { background:#3a3f47; flex:0.5; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:6px; }
  #grid button { padding:9px 4px; font-size:12px; border:1px solid #3a3f47; border-radius:8px; cursor:pointer; background:#262a31; color:#e8e8e8; }
  #grid button:hover { background:#353a42; }
  #hint { font-size:11px; color:#77808a; margin-top:8px; }
  @media (max-width: 900px) { #main { flex-direction:column; } #croppane { width:100%; min-height:32vh; } }
</style>
</head>
<body>
<div id="hdr"><span><a href="/">← back</a> &nbsp; <b id="title">Verify sample</b></span><span id="prog">loading…</span></div>
<div id="main">
  <div id="croppane"><canvas id="cropcv"></canvas><div id="claim">–</div></div>
  <div id="ctx"><canvas id="ctxcv"></canvas></div>
</div>
<div id="controls">
  <div id="vrow">
    <button id="backb" style="flex:0.5;background:#3a3f47">‹ Back</button>
    <button id="ok">✓ Correct (Enter)</button>
    <button id="nv">✗ Not a vehicle (X)</button>
    <button id="skipb">Skip</button>
  </div>
  <div id="grid"></div>
  <div id="hint">Random sample of tracked vehicles (each shown at its clearest moment). Wrong class? Tap the right one — your correction updates every count and report instantly. Keys: 1-9,0,q,w,e,r,t for classes.</div>
</div>
<script>
const vidId = new URLSearchParams(location.search).get("video");
const KEYS = ["1","2","3","4","5","6","7","8","9","0","q","w","e","r","t"];
const COLORS = ["#00e676","#ffca28","#29b6f6","#7e57c2","#26c6da","#ffee58","#8d6e63","#ff7043","#5c6bc0","#ec407a","#009688","#ffa726","#c0ca33","#a1887f","#90a4ae"];
let CLASSES = [], items = [], idx = 0, doneCount = 0, savedTotal = 0;
const answered = {};
const img = new Image();

async function load() {
  try { savedTotal = (await (await fetch(`/api/review-stats/${vidId}`)).json()).human_reviewed || 0; } catch(e) {}
  const j = await (await fetch(`/api/review-sample/${vidId}?n=80`)).json();
  CLASSES = j.classes; items = j.items;
  document.getElementById("grid").innerHTML = CLASSES.map((c,i) =>
    `<button data-c="${i}"><span style="color:#8899aa;font-size:10px">${KEYS[i]}</span> ${c}</button>`).join("");
  document.querySelectorAll("#grid button").forEach(b => b.onclick = () => reclass(+b.dataset.c));
  show();
}
async function show() {
  document.getElementById("prog").textContent = `${savedTotal + doneCount} verified total (saved) · ${items.length - idx} left in this sample`;
  if (idx >= items.length) { document.getElementById("claim").textContent = "sample complete 🎉  (reload for a fresh sample)"; return; }
  const it = items[idx];
  await new Promise(res => { img.onload = res; img.onerror = res; img.src = `/api/frame/${vidId}/${it.frame}`; });
  const W = img.naturalWidth, H = img.naturalHeight;
  const [x1, y1, x2, y2] = it.box, bw = x2-x1, bh = y2-y1;
  const m = Math.max(bw, bh) * 0.3;
  const sx = Math.max(0, x1-m), sy = Math.max(0, y1-m);
  const sw = Math.min(W-sx, bw+2*m), sh = Math.min(H-sy, bh+2*m);
  const cc = document.getElementById("cropcv"), scale = Math.min(430/sw, 330/sh, 4);
  cc.width = sw*scale; cc.height = sh*scale;
  const c1 = cc.getContext("2d");
  c1.drawImage(img, sx, sy, sw, sh, 0, 0, cc.width, cc.height);
  c1.strokeStyle = COLORS[it.cls%15]; c1.lineWidth = 3;
  c1.strokeRect((x1-sx)*scale, (y1-sy)*scale, bw*scale, bh*scale);
  const cl = document.getElementById("claim");
  cl.textContent = "AI says: " + it.cls_name + (answered[idx] ? "  ·  you: " + answered[idx] : ""); cl.style.color = COLORS[it.cls%15];
  const xc = document.getElementById("ctxcv"), cs = Math.min(920/W, 540/H);
  xc.width = W*cs; xc.height = H*cs;
  const c2 = xc.getContext("2d");
  c2.drawImage(img, 0, 0, xc.width, xc.height);
  c2.strokeStyle = COLORS[it.cls%15]; c2.lineWidth = 3;
  c2.strokeRect(x1*cs, y1*cs, bw*cs, bh*cs);
}
async function send(verdict, newc) {
  if (idx >= items.length) return;
  const it = items[idx];
  if (verdict !== "skip") {
    await fetch(`/api/review-verdict/${vidId}`, {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({track_id: it.track_id, frame: it.frame, verdict, new_class: newc ?? null})});
    if (!answered[idx]) doneCount++;
    answered[idx] = verdict + (newc != null ? " → " + CLASSES[newc] : "");
  }
  idx++; show();
}
document.addEventListener("DOMContentLoaded", () => {});
function reclass(c) { const cur = items[idx] && items[idx].cls; send(c === cur ? "correct" : "reclass", c); }
document.getElementById("backb").onclick = () => { if (idx > 0) { idx--; show(); } };
document.getElementById("ok").onclick = () => send("correct");
document.getElementById("nv").onclick = () => send("not_vehicle");
document.getElementById("skipb").onclick = () => send("skip");
document.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === "g") { send("correct"); return; }
  if (e.key === "x") { send("not_vehicle"); return; }
  if (e.key === " ") { e.preventDefault(); send("skip"); return; }
  const ki = KEYS.indexOf(e.key.toLowerCase());
  if (ki >= 0) reclass(ki);
});
fetch("/api/videos").then(r=>r.json()).then(vs => { const v = vs.find(x=>x.id==vidId); if (v) document.getElementById("title").textContent = "Verify sample — " + v.name; });
load();
</script>
</body>
</html>
